<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PET polar-map annotation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <main class="container">
        <section class="toolbar" aria-label="Annotation controls">
            <div class="tool-group" aria-label="Grid brush mode">
                <span class="control-label">Grid brush:</span>
                <button id="addCellsBtn" class="tool-button add-button active" type="button">Add cells</button>
                <button id="removeCellsBtn" class="tool-button remove-button" type="button">Remove cells</button>
                <button id="undoBtn" class="tool-button" type="button">Undo</button>
                <button id="redoBtn" class="tool-button" type="button">Redo</button>
            </div>

            <div class="tool-group guide-controls" aria-label="17-segment guide controls">
                <label class="toggle-label" for="guideToggle">
                    <input id="guideToggle" type="checkbox">
                    Show 17-segment guide
                </label>
                <label for="guideStrength">Guide strength:</label>
                <select id="guideStrength" disabled>
                    <option value="faint">Faint</option>
                    <option value="normal" selected>Normal</option>
                    <option value="bold">Bold</option>
                </select>
                <label class="toggle-label grid-toggle" for="cellGridToggle">
                    <input id="cellGridToggle" type="checkbox" checked>
                    Show cell grid
                </label>
            </div>
        </section>

        <p class="annotation-hint">
            Click or drag to select complete <strong>8 × 8-pixel cells</strong>. The black outer ring and left-side notch are non-adherent: you can drag over them, but no annotation will appear or be saved there.
        </p>

        <div class="canvas-container" aria-label="PET polar map annotation canvas">
            <canvas id="backgroundCanvas"></canvas>
            <canvas id="maskCanvas"></canvas>
            <canvas id="guideCanvas"></canvas>
            <canvas id="gridCanvas"></canvas>
        </div>

        <section class="prediction-controls" aria-label="Clinical classification">
            <label>
                <input type="radio" name="prediction" value="1" required> Ischemic
            </label>
            <label>
                <input type="radio" name="prediction" value="0" required> Non-ischemic
            </label>
        </section>

        <div class="bottom-toolbar">
            <button id="nextBtn" class="action-button" type="button">NEXT</button>
        </div>
    </main>
    <script defer src="/static/script.js"></script>
</body>
</html>
